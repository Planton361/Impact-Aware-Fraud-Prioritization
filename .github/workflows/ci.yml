name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  fast-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            environment/final_experiment_requirements.txt
            environment/bootstrap_requirements.txt
            pyproject.toml
      - name: Verify Python contract
        run: |
          python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"
      - name: Install
        run: |
          python -m pip install "pip==26.2"
          python -m pip install -r environment/final_experiment_requirements.txt
          python -m pip install -r environment/bootstrap_requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Ruff
        run: python -m ruff check src scripts tests
      - name: Compile and import
        run: |
          python -m compileall src scripts
          python -c "import fraud_detection; import fraud_detection.cli; print(fraud_detection.__file__)"
          python -c "from fraud_detection.setup import SetupFailure, SetupResult, DiagnosticFinding, DiagnosticReport, run_setup, run_doctor, run_check; from fraud_detection.experiment import ExperimentConfig, ExperimentPhase, ExperimentPlan, ExperimentResult, build_experiment_plan, run_experiment; from fraud_detection.presentation import PresentationConfig, PresentationStepResult, PresentationResult, PresentationError, build_presentation; assert all((SetupFailure, SetupResult, DiagnosticFinding, DiagnosticReport, run_setup, run_doctor, run_check, ExperimentConfig, ExperimentPhase, ExperimentPlan, ExperimentResult, build_experiment_plan, run_experiment, PresentationConfig, PresentationStepResult, PresentationResult, PresentationError, build_presentation))"
      - name: Collection gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q > "$RUNNER_TEMP/total-collection.txt"
          grep -Eq '150 tests collected' "$RUNNER_TEMP/total-collection.txt"
          python -m pytest --collect-only -q -m unit > "$RUNNER_TEMP/unit-collection.txt"
          grep -Eq '90/150 tests collected' "$RUNNER_TEMP/unit-collection.txt"
          python -m pytest --collect-only -q -m contract > "$RUNNER_TEMP/contract-collection.txt"
          grep -Eq '60/150 tests collected' "$RUNNER_TEMP/contract-collection.txt"
          set +e
          python -m pytest --collect-only -q -m 'not unit and not contract' > "$RUNNER_TEMP/unmarked-collection.txt" 2>&1
          unmarked_status=$?
          python -m pytest --collect-only -q -m 'unit and contract' > "$RUNNER_TEMP/overlap-collection.txt" 2>&1
          overlap_status=$?
          set -e
          test "$unmarked_status" -eq 5
          test "$overlap_status" -eq 5
          grep -Eq 'no tests collected|no tests ran|0 tests collected' "$RUNNER_TEMP/unmarked-collection.txt"
          grep -Eq 'no tests collected|no tests ran|0 tests collected' "$RUNNER_TEMP/overlap-collection.txt"
      - name: Fast unit and contract tests
        shell: bash
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          set -euo pipefail
          python -m pytest tests/unit tests/contract --durations=20 -q | tee "$RUNNER_TEMP/test-results.txt"
          grep -Eq '150 passed in [0-9.]+s$' "$RUNNER_TEMP/test-results.txt"
      - name: Public command help
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          fraud-detection --help
          fraud-detection setup --help
          fraud-detection check --help
          fraud-detection run --help
          fraud-detection build --help
          fraud-detection inspect --help

  distributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            environment/release_requirements.txt
            environment/final_experiment_requirements.txt
            environment/bootstrap_requirements.txt
            pyproject.toml
            MANIFEST.in
      - name: Verify Python contract
        run: |
          python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"
      - name: Install release tooling
        run: |
          python -m pip install "pip==26.2"
          python -m pip install -r environment/release_requirements.txt
      - name: Build and verify distributions
        shell: bash
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail

          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          work_root="$(mktemp -d "$RUNNER_TEMP/fraud-wheel.XXXXXX")"
          source_archive="$work_root/source.tar"
          source_root="$work_root/source"
          sdist_dir="$work_root/sdist"
          sdist_extract="$work_root/sdist-extract"
          wheel_dir="$work_root/wheel"
          smoke_root="$work_root/smoke"
          venv_root="$work_root/venv"
          mkdir -p "$source_root" "$sdist_dir" "$sdist_extract" "$wheel_dir" "$smoke_root"

          git archive --format=tar --output="$source_archive" HEAD
          tar -xf "$source_archive" -C "$source_root"

          python -m build --sdist --outdir "$sdist_dir" "$source_root" \
            >"$work_root/sdist-build.log" 2>&1
          shopt -s nullglob
          sdists=("$sdist_dir"/*.tar.gz)
          test "${#sdists[@]}" -eq 1
          test "$(basename "${sdists[0]}")" = "fraud_detection_masterarbeit-0.1.0.tar.gz"

          tar -xzf "${sdists[0]}" -C "$sdist_extract"
          sdist_roots=("$sdist_extract"/*)
          test "${#sdist_roots[@]}" -eq 1
          sdist_root="${sdist_roots[0]}"

          python -m build --wheel --outdir "$wheel_dir" "$sdist_root" \
            >"$work_root/wheel-build.log" 2>&1
          wheels=("$wheel_dir"/*.whl)
          test "${#wheels[@]}" -eq 1
          test "$(basename "${wheels[0]}")" = "fraud_detection_masterarbeit-0.1.0-py3-none-any.whl"

          cat "$work_root/sdist-build.log" "$work_root/wheel-build.log"
          if grep -Eiq \
            "deprecated.*license|license.*deprecated|ambiguous.*license|missing.*LICENSE|unsupported.*PEP.?639|License :: OSI" \
            "$work_root/sdist-build.log" "$work_root/wheel-build.log"; then
            echo "A5 license metadata warning detected" >&2
            exit 1
          fi

          SOURCE_ROOT="$source_root" SDIST_PATH="${sdists[0]}" \
            WHEEL_PATH="${wheels[0]}" python - <<'PY'
          import os
          import re
          import tarfile
          import tomllib
          from email.parser import Parser
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          source_root = Path(os.environ["SOURCE_ROOT"]).resolve()
          sdist_path = Path(os.environ["SDIST_PATH"])
          wheel_path = Path(os.environ["WHEEL_PATH"])
          project = tomllib.loads(
              (source_root / "pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          expected_python = {
              part.strip() for part in project["requires-python"].split(",")
          }

          def normalize_dependency(value: str) -> str:
              base = value.split(";", 1)[0].strip()
              match = re.match(r"^([A-Za-z0-9][A-Za-z0-9._-]*)(.*)$", base)
              assert match is not None, value
              name, specifiers = match.groups()
              clauses = sorted(
                  part.strip()
                  for part in specifiers.split(",")
                  if part.strip()
              )
              return name.lower() + ",".join(clauses)

          expected_dependencies = {
              normalize_dependency(value) for value in project["dependencies"]
          }

          def assert_safe(path: str) -> None:
              pure = PurePosixPath(path)
              assert not pure.is_absolute(), path
              assert ".." not in pure.parts, path
              assert "\\" not in path, path
              assert "__pycache__" not in pure.parts, path
              assert not path.endswith((".pyc", ".pyo")), path

          def metadata_from_bytes(value: bytes):
              return Parser().parsestr(value.decode("utf-8"))

          def runtime_dependencies(metadata) -> set[str]:
              return {
                  normalize_dependency(value)
                  for value in metadata.get_all("Requires-Dist", [])
                  if "; extra" not in value
              }

          with ZipFile(wheel_path) as archive:
              names = archive.namelist()
              assert all(assert_safe(name) is None for name in names)
              dist_infos = {
                  name.split("/", 1)[0]
                  for name in names
                  if ".dist-info/" in name
              }
              packages = {
                  name.split("/", 1)[0]
                  for name in names
                  if name.startswith("fraud_detection/")
              }
              assert dist_infos == {"fraud_detection_masterarbeit-0.1.0.dist-info"}
              assert packages == {"fraud_detection"}
              metadata = metadata_from_bytes(
                  archive.read(
                      "fraud_detection_masterarbeit-0.1.0.dist-info/METADATA"
                  )
              )
              assert metadata["Name"] == project["name"]
              assert metadata["Version"] == project["version"]
              assert {
                  part.strip()
                  for part in metadata["Requires-Python"].split(",")
              } == expected_python
              assert metadata["License-Expression"] == "MIT"
              assert metadata["License-File"] == "LICENSE"
              assert (
                  "fraud_detection_masterarbeit-0.1.0.dist-info/licenses/LICENSE"
                  in names
              )
              assert runtime_dependencies(metadata) == expected_dependencies
              entry_points = archive.read(
                  "fraud_detection_masterarbeit-0.1.0.dist-info/entry_points.txt"
              ).decode("utf-8")
              assert "fraud-detection = fraud_detection.cli:main" in entry_points
              forbidden = (
                  "tests/",
                  "scripts/",
                  "environment/",
                  "docs/",
                  "data/",
                  "reference_results/",
                  "generated/",
                  "outputs/",
                  "thesis_build/",
                  "AGENTS.md",
              )
              assert all(not name.startswith(forbidden) for name in names)
              assert all(
                  not name.lower().endswith((".pdf", ".pem", ".key", ".p12"))
                  and "credential" not in name.lower()
                  for name in names
              )
              assert all(".dist-info/licenses/" in name or "/" in name for name in names)
              wheel_metadata = metadata

          with tarfile.open(sdist_path, "r:gz") as archive:
              names = archive.getnames()
              assert all(assert_safe(name) is None for name in names)
              roots = {name.split("/", 1)[0] for name in names}
              assert roots == {"fraud_detection_masterarbeit-0.1.0"}
              root = "fraud_detection_masterarbeit-0.1.0/"
              relative = {name[len(root):] for name in names if name.startswith(root)}
              required = {
                  "pyproject.toml",
                  "README.md",
                  "LICENSE",
                  "CITATION.cff",
                  "MANIFEST.in",
              }
              assert required <= relative
              expected_sources = {
                  path.relative_to(source_root).as_posix()
                  for path in (source_root / "src" / "fraud_detection").rglob("*.py")
              }
              assert expected_sources <= relative
              forbidden = (
                  "AGENTS.md",
                  ".github/",
                  "tests/",
                  "scripts/",
                  "environment/",
                  "docs/",
                  "data/",
                  "reference_results/",
                  "generated/",
                  "outputs/",
                  "thesis_build/",
              )
              assert all(not path.startswith(forbidden) for path in relative)
              assert all(
                  not path.lower().endswith((".pdf", ".pem", ".key", ".p12"))
                  and "credential" not in path.lower()
                  for path in relative
              )
              sdist_entry_points = root + (
                  "src/fraud_detection_masterarbeit.egg-info/entry_points.txt"
              )
              assert sdist_entry_points in names
              assert "fraud-detection = fraud_detection.cli:main" in (
                  archive.extractfile(sdist_entry_points).read().decode("utf-8")
              )
              metadata = metadata_from_bytes(
                  archive.extractfile(root + "PKG-INFO").read()
              )
              assert metadata["Name"] == project["name"]
              assert metadata["Version"] == project["version"]
              assert {
                  part.strip()
                  for part in metadata["Requires-Python"].split(",")
              } == expected_python
              assert metadata["License-Expression"] == "MIT"
              assert metadata["License-File"] == "LICENSE"
              assert runtime_dependencies(metadata) == expected_dependencies

              sdist_metadata = metadata

          assert sdist_metadata["Name"] == project["name"]
          assert sdist_metadata["Version"] == project["version"]
          assert {
              part.strip()
              for part in sdist_metadata["Requires-Python"].split(",")
          } == expected_python
          assert sdist_metadata["License-Expression"] == "MIT"
          assert sdist_metadata["License-File"] == "LICENSE"
          assert runtime_dependencies(sdist_metadata) == expected_dependencies
          assert sdist_metadata["Name"] == wheel_metadata["Name"]
          assert sdist_metadata["Version"] == wheel_metadata["Version"]
          assert {
              part.strip()
              for part in sdist_metadata["Requires-Python"].split(",")
          } == {
              part.strip()
              for part in wheel_metadata["Requires-Python"].split(",")
          }
          assert (
              sdist_metadata["License-Expression"]
              == wheel_metadata["License-Expression"]
          )
          assert sdist_metadata["License-File"] == wheel_metadata["License-File"]
          assert runtime_dependencies(sdist_metadata) == runtime_dependencies(
              wheel_metadata
          )
          PY

          python -m venv "$venv_root"
          venv_python="$venv_root/bin/python"
          "$venv_python" -m pip install "pip==26.2"
          "$venv_python" -m pip install \
            -r "$source_root/environment/final_experiment_requirements.txt"
          "$venv_python" -m pip install \
            -r "$source_root/environment/bootstrap_requirements.txt"
          "$venv_python" -m pip install --no-deps "${wheels[0]}"
          "$venv_python" -m pip check

          cd "$smoke_root"
          unset PYTHONPATH
          "$venv_python" - <<'PY'
          import sys

          import fraud_detection.setup

          forbidden = (
              "numpy",
              "pandas",
              "sklearn",
              "lightgbm",
              "fraud_detection.experiment",
              "fraud_detection.presentation",
          )
          assert all(name not in sys.modules for name in forbidden)
          PY
          "$venv_python" - <<'PY'
          import sys

          import fraud_detection.presentation

          forbidden = (
              "lightgbm",
              "fraud_detection.experiment",
              "fraud_detection.presentation.preparation.data",
              "fraud_detection.presentation.rendering.figures",
              "fraud_detection.presentation.rendering.tables",
          )
          assert all(name not in sys.modules for name in forbidden)
          PY
          CHECKOUT_ROOT="$GITHUB_WORKSPACE" SOURCE_ROOT="$source_root" \
            VENV_ROOT="$venv_root" "$venv_python" - <<'PY'
          import importlib
          import os
          import site
          import sys
          from importlib import metadata, util
          from pathlib import Path

          checkout_root = Path(os.environ["CHECKOUT_ROOT"]).resolve()
          source_root = Path(os.environ["SOURCE_ROOT"]).resolve()
          package = importlib.import_module("fraud_detection")
          package_path = Path(package.__file__).resolve()
          assert not package_path.is_relative_to(checkout_root), package_path
          assert not package_path.is_relative_to(source_root), package_path

          site_roots = [Path(value).resolve() for value in site.getsitepackages()]
          package_dirs = [root / "fraud_detection" for root in site_roots]
          package_dirs = [path for path in package_dirs if path.is_dir()]
          assert len(package_dirs) == 1, package_dirs
          dist_infos = [
              path
              for root in site_roots
              for path in root.glob("fraud_detection_masterarbeit-*.dist-info")
          ]
          assert len(dist_infos) == 1, dist_infos

          setup_spec = util.find_spec("fraud_detection.setup")
          assert setup_spec is not None
          assert setup_spec.submodule_search_locations is not None
          assert Path(setup_spec.origin).name == "__init__.py"
          assert not (package_path.parent / "setup.py").exists()

          old_modules = (
              "fraud_detection.diagnostics",
              "fraud_detection.experiment.pipeline",
              "fraud_detection.experiment.planning",
              "fraud_detection.experiment.validation",
              "fraud_detection.experiment.results",
              "fraud_detection.experiment.data_preparation",
              "fraud_detection.experiment.bce_scoring",
              "fraud_detection.experiment.ranking_inputs",
              "fraud_detection.experiment.comparison_paths._lambdarank",
              "fraud_detection.experiment.comparison_paths.policy_selection",
              "fraud_detection.experiment.evaluation.composition",
              "fraud_detection.experiment.evaluation.analyses",
              "fraud_detection.presentation.data",
              "fraud_detection.presentation.derivations",
              "fraud_detection.presentation.figures",
              "fraud_detection.presentation.tables",
              "fraud_detection.presentation.style",
          )
          assert all(util.find_spec(name) is None for name in old_modules)

          setup = importlib.import_module("fraud_detection.setup")
          setup_environment = importlib.import_module(
              "fraud_detection.setup.environment"
          )
          setup_diagnostics = importlib.import_module(
              "fraud_detection.setup.diagnostics"
          )
          assert setup.SetupFailure is setup_environment.SetupFailure
          assert setup.SetupResult is setup_environment.SetupResult
          assert setup.DiagnosticFinding is setup_diagnostics.DiagnosticFinding
          assert setup.DiagnosticReport is setup_diagnostics.DiagnosticReport
          assert setup.run_setup is setup_environment.run_setup
          assert setup.run_doctor is setup_diagnostics.run_doctor
          assert setup.run_check is setup_diagnostics.run_check

          experiment = importlib.import_module("fraud_detection.experiment")
          experiment_config = importlib.import_module(
              "fraud_detection.experiment.config"
          )
          experiment_planning = importlib.import_module(
              "fraud_detection.experiment.execution.planning"
          )
          experiment_records = importlib.import_module(
              "fraud_detection.experiment.records"
          )
          experiment_pipeline = importlib.import_module(
              "fraud_detection.experiment.execution.pipeline"
          )
          assert experiment.ExperimentConfig is experiment_config.ExperimentConfig
          assert experiment.ExperimentPhase is experiment_config.ExperimentPhase
          assert experiment.ExperimentPlan is experiment_planning.ExperimentPlan
          assert experiment.ExperimentResult is experiment_records.ExperimentResult
          assert (
              experiment.build_experiment_plan
              is experiment_planning.build_experiment_plan
          )
          assert experiment.run_experiment is experiment_pipeline.run_experiment

          presentation = importlib.import_module("fraud_detection.presentation")
          presentation_build = importlib.import_module(
              "fraud_detection.presentation.build"
          )
          assert (
              presentation.PresentationConfig
              is presentation_build.PresentationConfig
          )
          assert (
              presentation.PresentationStepResult
              is presentation_build.PresentationStepResult
          )
          assert (
              presentation.PresentationResult
              is presentation_build.PresentationResult
          )
          assert (
              presentation.PresentationError
              is presentation_build.PresentationError
          )
          assert (
              presentation.build_presentation
              is presentation_build.build_presentation
          )

          cli = importlib.import_module("fraud_detection.cli")
          entry_points = tuple(
              metadata.entry_points(
                  group="console_scripts",
                  name="fraud-detection",
              )
          )
          assert len(entry_points) == 1, entry_points
          assert entry_points[0].value == "fraud_detection.cli:main"
          assert entry_points[0].load() is cli.main
          PY

          "$venv_root/bin/fraud-detection" --help >/dev/null
          "$venv_root/bin/fraud-detection" setup --help >/dev/null
          "$venv_root/bin/fraud-detection" check --help >/dev/null
          "$venv_root/bin/fraud-detection" run --help >/dev/null
          "$venv_root/bin/fraud-detection" build --help >/dev/null
          "$venv_root/bin/fraud-detection" inspect --help >/dev/null

          cd "$source_root"
          unset PYTHONPATH
          test ! -e "$source_root/generated"
          "$venv_root/bin/fraud-detection" run --profile smoke-synthetic --dry-run
          test ! -e "$source_root/generated"

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            environment/final_experiment_requirements.txt
            environment/bootstrap_requirements.txt
            pyproject.toml
      - name: Verify Python contract
        run: |
          python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"
      - name: Install runtime and development dependencies
        run: |
          python -m pip install "pip==26.2"
          python -m pip install -r environment/final_experiment_requirements.txt
          python -m pip install -r environment/bootstrap_requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Platform contract tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest tests/contract/test_packaging.py tests/contract/test_setup.py -q
      - name: Public command help
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          fraud-detection --help
          fraud-detection setup --help
          fraud-detection check --help
          fraud-detection run --help
          fraud-detection build --help
          fraud-detection inspect --help
      - name: Dry-run purity
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          python -c "from pathlib import Path; import sys; roots=[Path(name) for name in ('generated', 'outputs', 'thesis_build')]; existing=[str(path) for path in roots if path.exists()]; assert not existing, existing"
          fraud-detection run --profile smoke-synthetic --dry-run
          python -c "from pathlib import Path; import sys; roots=[Path(name) for name in ('generated', 'outputs', 'thesis_build')]; existing=[str(path) for path in roots if path.exists()]; assert not existing, existing"
