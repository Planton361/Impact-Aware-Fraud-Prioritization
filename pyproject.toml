[build-system]
requires = [
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-masterarbeit"
version = "0.1.0"
description = "Reproducible budget-conditioned Amount-Gain ranking experiment for fraud detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Anton Platonov" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "fraud detection",
  "learning to rank",
  "credit-card transactions",
  "reproducible research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "lightgbm>=4.0",
  "pyarrow>=14.0",
  "matplotlib>=3.7",
  "pillow>=10.0",
  "typer>=0.27,<0.28",
  "rich>=15,<16",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers"]
markers = [
  "unit: isolated scientific or deterministic helper behavior",
  "contract: documented user, CLI, packaging or platform boundary",
  "smoke: bounded synthetic pipeline behavior outside the fast suite",
]
